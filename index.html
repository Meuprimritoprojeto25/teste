<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Página Hello Word."
    >
    <title>Hello Word</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: #172033;
        background: #f4f7fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background:
          radial-gradient(circle at top left, #dce8ff 0, transparent 42%),
          #f4f7fb;
      }

      main {
        width: min(100%, 42rem);
        padding: clamp(2rem, 7vw, 4rem);
        text-align: center;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 1.25rem;
        box-shadow: 0 1.5rem 4rem rgb(32 56 117 / 12%);
      }

      h1 {
        margin: 0;
        font-size: clamp(1.75rem, 6vw, 2.75rem);
        line-height: 1.15;
        letter-spacing: -0.035em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello Word</h1>
    </main>
  </body>
</html>
